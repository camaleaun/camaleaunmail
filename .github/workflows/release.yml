name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies and build assets
        run: npm ci && npm run build

      - name: Install Composer dependencies (generates includes/class-spyc.php via post-install-cmd)
        run: composer install --no-interaction --prefer-dist

      # The zip is the runtime files only: .gitattributes export-ignore drops the
      # dev files and languages/ (translations ship as language packs, see
      # language.yml), and SelfDirectory comes from its submodule.
      - name: Build plugin zip
        id: build
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p /tmp/build

          git archive HEAD --prefix=camaleaunmail/ | tar xf - -C /tmp/build/

          git -C lib/selfdirectory archive HEAD \
            --prefix=camaleaunmail/lib/selfdirectory/ \
            -- class-selfdirectory.php \
            | tar xf - -C /tmp/build/

          # build/ is .gitignore'd so git archive omits it; copy the freshly built assets.
          cp -r build/ /tmp/build/camaleaunmail/build/

          # includes/class-spyc.php is .gitignore'd (generated by bin/copy-spyc.php);
          # copy the file produced by composer install above.
          cp includes/class-spyc.php /tmp/build/camaleaunmail/includes/class-spyc.php

          cd /tmp/build && zip -qr "camaleaunmail.${tag}.zip" camaleaunmail
          echo "zip=/tmp/build/camaleaunmail.${tag}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload plugin zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip }}
          generate_release_notes: true
